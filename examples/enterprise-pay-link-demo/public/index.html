<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bean &amp; Bridge — Checkout</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2;
    --surface: #ffffff;
    --text: #1a1a19;
    --muted: #6b6b66;
    --line: #e3e1db;
    --accent: #1a1a19;
    --accent-text: #ffffff;
    --ok: #157347;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131311; --surface: #1c1c1a; --text: #ece9e3; --muted: #9a978f;
      --line: #2e2e2b; --accent: #ece9e3; --accent-text: #131311; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header {
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    position: sticky; top: 0; z-index: 5;
  }
  header .inner {
    max-width: 940px; margin: 0 auto; padding: 18px 20px;
    display: flex; align-items: baseline; gap: 12px;
  }
  .head-spacer { flex: 1; }
  .head-token {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.85rem;
  }
  .wordmark { font-size: 1.05rem; font-weight: 620; letter-spacing: -0.01em; }
  .tag { font-size: 0.78rem; color: var(--muted); }
  main { max-width: 940px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 1.5rem; font-weight: 620; letter-spacing: -0.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 0.92rem; }
  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 28px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

  .product {
    display: flex; gap: 16px; align-items: center;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 12px;
  }
  .art {
    width: 56px; height: 56px; flex: none; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 1.6rem;
  }
  .product .body { flex: 1; min-width: 0; }
  .product .name { font-weight: 560; }
  .product .note { color: var(--muted); font-size: 0.84rem; margin-top: 2px; }
  .product .price { font-variant-numeric: tabular-nums; font-size: 0.92rem; margin-top: 6px; }

  .stepper { display: flex; align-items: center; gap: 2px; }
  .stepper button {
    width: 30px; height: 30px; border: 1px solid var(--line); background: var(--surface);
    color: var(--text); border-radius: 8px; cursor: pointer; font-size: 1rem; line-height: 1;
  }
  .stepper button:hover { border-color: var(--muted); }
  .stepper .qty { width: 34px; text-align: center; font-variant-numeric: tabular-nums; font-size: 0.95rem; }

  .summary {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; position: sticky; top: 88px;
  }
  .summary h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 14px; font-weight: 560; }
  .line { display: flex; justify-content: space-between; gap: 12px; font-size: 0.9rem; padding: 6px 0; }
  .line .qtyname { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line .amt { font-variant-numeric: tabular-nums; flex: none; }
  .total { display: flex; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 12px; padding-top: 14px; font-weight: 620; }
  .total .amt { font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 0.88rem; padding: 6px 0 2px; }

  button.pay {
    width: 100%; margin-top: 18px; padding: 12px 16px;
    background: var(--accent); color: var(--accent-text);
    border: 0; border-radius: 10px; font-size: 0.95rem; font-weight: 560; cursor: pointer;
  }
  button.pay:disabled { opacity: 0.4; cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 0.78rem; margin-top: 10px; line-height: 1.5; }
  .err {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem;
    background: color-mix(in srgb, #dc2626 12%, transparent);
    border: 1px solid color-mix(in srgb, #dc2626 40%, transparent);
    white-space: pre-wrap; word-break: break-word;
  }
  footer { max-width: 940px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>
<header>
  <div class="inner">
    <span class="wordmark">Bean &amp; Bridge</span>
    <span class="tag">Coffee, shipped Tuesdays</span>
    <span class="head-spacer"></span>
    <select id="tokenSelect" class="head-token" aria-label="Price currency"></select>
  </div>
</header>

<main>
  <h1>Your order</h1>
  <p class="sub">Pick what you want, then pay with any wallet. No account, no card.</p>

  <div class="layout">
    <section id="products" aria-label="Products"></section>

    <aside class="summary">
      <h2>Order summary</h2>
      <div id="lines"><div class="empty">Nothing selected yet.</div></div>
      <div class="total"><span>Total</span><span class="amt" id="total">0.00</span></div>
      <button class="pay" id="payBtn" disabled>Pay</button>
      <p class="hint" id="hint">Prices are calculated on the server.</p>
      <div class="err" id="err" hidden></div>
    </aside>
  </div>
</main>

<footer>Merchant Checkout Demo · payments by Givro</footer>

<script>
  const cart = new Map();
  let currency = "USDC";
  let tokenSymbols = [];
  let networks = [];

  const el = {
    products: document.getElementById("products"),
    lines: document.getElementById("lines"),
    total: document.getElementById("total"),
    pay: document.getElementById("payBtn"),
    hint: document.getElementById("hint"),
    err: document.getElementById("err"),
    tokenSelect: document.getElementById("tokenSelect"),
  };

  /** What this checkout will actually put on the link, in the buyer's terms. */
  function renderHint(config) {
    const symbol = selectedTokenSymbol();
    const network = networks.find((n) => n.ecosystem === "evm") ?? networks[0] ?? null;
    if (!network) {
      el.hint.textContent = `Pay with ${symbol} · ${config.environment} environment.`;
      return;
    }
    const chains = network.chains.join(", ");
    el.hint.textContent = `Pay with ${symbol} on ${chains} — pick the network after connecting a wallet on the Givro page · ${config.environment} environment.`;
  }

  function selectedTokenSymbol() {
    const symbol = String(el.tokenSelect.value || "").trim().toUpperCase();
    return tokenSymbols.includes(symbol) ? symbol : (tokenSymbols[0] || currency);
  }

  function cents(decimal) {
    const [w, f = ""] = String(decimal).split(".");
    return Number(w) * 100 + Number((f + "00").slice(0, 2));
  }
  function money(c) {
    return `${Math.floor(c / 100)}.${String(c % 100).padStart(2, "0")}`;
  }

  function showError(message) {
    el.err.hidden = !message;
    el.err.textContent = message || "";
  }

  function applyCurrency() {
    currency = selectedTokenSymbol();
    render(window.__products || []);
    renderCart(window.__products || []);
    if (window.__config) renderHint(window.__config);
  }

  function render(products) {
    el.products.innerHTML = "";
    for (const p of products) {
      const row = document.createElement("div");
      row.className = "product";
      row.innerHTML = `
        <div class="art">${p.art}</div>
        <div class="body">
          <div class="name"></div>
          <div class="note"></div>
          <div class="price"></div>
        </div>
        <div class="stepper">
          <button type="button" aria-label="Remove one">−</button>
          <span class="qty">0</span>
          <button type="button" aria-label="Add one">+</button>
        </div>`;
      row.querySelector(".name").textContent = p.name;
      row.querySelector(".note").textContent = p.note;
      row.querySelector(".price").textContent = `${p.price} ${currency}`;
      const [minus, plus] = row.querySelectorAll(".stepper button");
      const qtyEl = row.querySelector(".qty");
      const bump = (delta) => {
        const next = Math.max(0, Math.min(99, (cart.get(p.sku) ?? 0) + delta));
        if (next === 0) cart.delete(p.sku); else cart.set(p.sku, next);
        qtyEl.textContent = String(next);
        renderCart(products);
      };
      minus.addEventListener("click", () => bump(-1));
      plus.addEventListener("click", () => bump(1));
      el.products.appendChild(row);
    }
  }

  function renderCart(products) {
    el.lines.innerHTML = "";
    let totalCents = 0;
    for (const [sku, qty] of cart) {
      const p = products.find((x) => x.sku === sku);
      if (!p) continue;
      const lineCents = cents(p.price) * qty;
      totalCents += lineCents;
      const line = document.createElement("div");
      line.className = "line";
      line.innerHTML = `<span class="qtyname"></span><span class="amt"></span>`;
      line.querySelector(".qtyname").textContent = `${qty} × ${p.name}`;
      line.querySelector(".amt").textContent = money(lineCents);
      el.lines.appendChild(line);
    }
    if (cart.size === 0) {
      el.lines.innerHTML = `<div class="empty">Nothing selected yet.</div>`;
    }
    el.total.textContent = `${money(totalCents)} ${currency}`;
    el.pay.disabled = cart.size === 0;
    el.pay.textContent = cart.size === 0 ? "Pay" : `Pay ${money(totalCents)} ${currency}`;
  }

  async function checkout() {
    showError("");
    el.pay.disabled = true;
    el.pay.textContent = "Creating order…";
    try {
      const res = await fetch("/api/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          items: [...cart].map(([sku, quantity]) => ({ sku, quantity })),
          token_symbol: selectedTokenSymbol(),
        }),
      });
      const body = await res.json();
      if (!res.ok || !body.ok) throw new Error(body.code ? `${body.error} (${body.code})` : body.error || `HTTP ${res.status}`);

      // The pay page opens in its own tab and this tab becomes the order
      // page. A return_url on the link is a courtesy button back here; the
      // webhook is still what marks the order paid.
      window.open(body.pay_url, "_blank", "noopener");
      window.location.href = `/order/${body.order_id}`;
    } catch (error) {
      showError(String(error.message || error));
      el.pay.disabled = false;
      renderCart(window.__products || []);
    }
  }

  (async () => {
    try {
      const [catalog, config] = await Promise.all([
        fetch("/api/catalog").then((r) => r.json()),
        fetch("/api/config").then((r) => r.json()),
      ]);
      // Storefront prices in one stablecoin. Chains stay on the Givro pay page.
      tokenSymbols = Array.isArray(catalog.accepted_token_symbols) && catalog.accepted_token_symbols.length
        ? catalog.accepted_token_symbols.map((s) => String(s).toUpperCase())
        : ["USDC", "USDT"];
      networks = Array.isArray(catalog.networks) ? catalog.networks : [];
      el.tokenSelect.innerHTML = "";
      for (const symbol of tokenSymbols) {
        const option = document.createElement("option");
        option.value = symbol;
        option.textContent = symbol;
        el.tokenSelect.appendChild(option);
      }
      const preferred = String(catalog.default_token_symbol || "USDC").toUpperCase();
      el.tokenSelect.value = tokenSymbols.includes(preferred) ? preferred : tokenSymbols[0];
      el.tokenSelect.hidden = tokenSymbols.length < 2;
      currency = selectedTokenSymbol();
      window.__products = catalog.products;
      window.__config = config;
      render(catalog.products);
      renderCart(catalog.products);
      if (!config.has_api_key) {
        showError("GIVRO_API_KEY is not set — checkout will fail. Set it in .env and restart.");
      } else {
        renderHint(config);
      }
    } catch (error) {
      showError(`Could not load the store: ${error.message || error}`);
    }
  })();

  el.pay.addEventListener("click", checkout);
  el.tokenSelect.addEventListener("change", applyCurrency);
</script>
</body>
</html>
